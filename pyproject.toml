[project]
name = "epidemi"
version = "1.0.0"
description = "Vector-host dengue model and stochastic temperature generator for Oran, Argentina"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epidemi", "epidemi.core", "epidemi.data"]
include-package-data = true

[tool.setuptools.package-data]
"epidemi.data" = ["*.txt"]
